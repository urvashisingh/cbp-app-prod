apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:

jobs:
  call_with_job1:
    uses: ./.cloudbees/workflows/conditions_in_ru_wf_outputs.yaml
    with:
      job: job1
  after_job1:
    needs: call_with_job1
    steps:
      - name: Say hello
        id: step1
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world"
          echo "output from job1 ${{ needs.call_with_job1.outputs.out }}"
  call_with_job2:
    uses: ./.cloudbees/workflows/conditions_in_ru_wf_outputs.yaml
    with:
      job: job2
  after_job2:
    needs: call_with_job2
    steps:
      - name: Say hello
        id: step1
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world"
          echo "output from job2 ${{ needs.call_with_job2.outputs.out }}"        