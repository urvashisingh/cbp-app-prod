apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deploy
on:
  workflow_call:
    inputs:
      manifest:
        type: string
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      artifact-id:
        type: string
      environment:
        type: string
        required: true      
jobs:
  deploy:
    vars: inherit
    uses: urvashisingh/comp2/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: ${{ inputs.artifact-id }}
      environment: ${{ inputs.environment }}
      deployment-strategy: ${{ inputs.environment == 'us-prod' && 'canary' || 'none' }}
