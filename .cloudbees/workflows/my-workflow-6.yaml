apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: This is a system-generated parameter and is required for use in application releases. Refer to https://docs.cloudbees.com/docs/cloudbees-platform/latest/applications/releases#manifest for the expected format
metadata:
  stages/v1alpha1:
    - name: us-test
      jobs:
        - us-test
        - job1
    - name: us-prod
      jobs:
        - us-prod
        - job2
    - name: us-env
      jobs:
        - us-env
jobs:
  us-test:
    environment: us-test
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  us-prod:
    needs:
      - job1
      - us-test
    environment: us-prod
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  us-env:
    needs:
      - job2
      - us-prod
    environment: us-env
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  job1:
    steps:
      - with:
          bucket-name: a
          file-path: a
          s3-path: a
        uses: cloudbees-io/s3-download-object@v1
        name: a
  job2:
    steps:
      - with:
          bucket-name: q
          file-path: q
          s3-path: q
        uses: cloudbees-io/s3-upload-object@v1
        name: q
