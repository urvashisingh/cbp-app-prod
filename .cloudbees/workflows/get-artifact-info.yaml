apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        type: string
        required: true
jobs:
  build:
    env:
      JWT: ${{ cloudbees.api.token }}
      CB_API_URL: ${{ cloudbees.api.url }}
    steps:
      - name: Say hello
        uses: docker://ghcr.io/helmfile/helmfile:v1.1.2
        shell: sh
        run: |
          function get_artifact_version() {
            local artifact_id=$1
            local out_version=$2

            response=$(curl --silent --show-error --fail-with-body -X 'GET' "$CB_API_URL/v3/artifactinfos/${artifact_id}" \
              -H "Authorization: Bearer $JWT" \
              -H 'Content-Type: application/json') || command_failed=1

            if [ ${command_failed:-0} -eq 1 ];
            then
              echo "Failed to lookup artifact with id: $artifact_id, error: '$response'"
              eval $out_version=""
            else
              echo "Response from artifact lookup: $response"
              found_version=$(echo "$response" | jq -r '.version')
          
              if [ "$found_version" = "null" ] || [ -z "$found_version" ]; then
                eval $out_version="" 
              else
                eval $out_version="'$found_version'"
              fi
            fi  
          }

          get_artifact_version "${{ inputs.artifact_id }}" _out_manifest_version
          echo "Found version $_out_manifest_version"

