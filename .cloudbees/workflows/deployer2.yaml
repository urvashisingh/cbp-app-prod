apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer2

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      manifest:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      env:
        type: string
        required: true
      manifest:
        type: string
        required: true
jobs:
  comp1-art1:
    if: ${{ fromJSON(inputs.manifest)['comp1']['art1'].deploy }}
    uses: JCWook/sample-go-app/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: ${{ fromJSON(inputs.manifest)['comp1']['art1'].id }}
      env: ${{ inputs.env }}

