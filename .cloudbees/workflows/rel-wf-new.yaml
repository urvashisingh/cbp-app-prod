apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: This is a system-generated parameter and is required for use in application releases. Refer to https://docs.cloudbees.com/docs/cloudbees-platform/latest/applications/releases#manifest for the expected format
      test:
        type: string
metadata:
  stages/v1alpha1:
    - name: us-test
      jobs:
        - us-test
        - enable-flags-synch
    - name: us-prod
      jobs:
        - us-prod
        - enable-flags-asynch
    - name: us-env
      jobs:
        - us-env
jobs:
  us-test:
    environment: us-test
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  us-prod:
    needs: enable-flags-synch
    environment: us-prod
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  us-env:
    needs: enable-flags-asynch
    environment: us-env
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
  enable-flags-synch:
    needs: us-test
    steps:
      - with:
          action-name: q
          version: s
          url: a
        uses: cloudbees-io/register-build-artifact@v2
  enable-flags-asynch:
    needs:
      - us-prod
    steps:
      - with:
          action-name: a
          version: a
          url: a
        uses: cloudbees-io/register-build-artifact@v2
