apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      manifest:
        type: string
        required: true

jobs:
  comp1-index_docker_io_urvashisingh_my-sample-go-app:
    if: ${{ fromJSON(inputs.manifest)['comp1']['index.docker.io/urvashisingh/my-sample-go-app'].deploy }}
    uses: JCWook/sample-go-app/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: ${{ fromJSON(inputs.manifest)['comp1']['index.docker.io/urvashisingh/my-sample-go-app'].id }}
      environment: ${{ inputs.environment }}
  comp1-art1:
    if: ${{ fromJSON(inputs.manifest)['comp1']['art1'].deploy }}
    uses: JCWook/sample-go-app/.cloudbees/workflows/deploy.yaml
    with:
      artifact-id: ${{ fromJSON(inputs.manifest)['comp1']['art1'].id }}
      environment: ${{ inputs.environment }}
