apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Test workflow
on:
  workflow_dispatch:
    inputs: &params
      str:
        type: string
        default: s1
      num:
        type: number
        required: true
      bool1:
        type: boolean
        default: false
      ops:
        type: choice
        options:
          - op1
          - op2
        default: op1
  workflow_call:
    inputs:
      <<: *params

        
jobs:
  build:
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "String parameter: ${{ inputs.str }}"
          echo "Num parameter: ${{ inputs.num }}"
      - name: Publish evidence
        uses: cloudbees-io/publish-evidence-item
        with:
          content: |
            - item1
            - item2    
  
